<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Ticket Booking</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <p class="cinema-tag"> ★ DESDE 1928 ★ </p>
        <h1>Cineplus</h1>
        <p>Elegí tu película y reservá tus entradas</p>
    </header>

    <main>

        <!-- Movies Section -->
        <section id="peliculas-section">
            <h2>Películas Disponibles</h2>

            <div class="movies-container">

                <div class="movie-card">
                    <h3>El final de la calle Oak</h3>
                    <img src="./assets/oakstreet.jpg" alt="oakstreet">
                    <button class="movie-btn" data-movie="El final de la calle Oak">
                        Selececcionar
                    </button>
                </div>

                <div class="movie-card">
                    <h3>La noche del demonio: Están entre nosotros</h3>
                    <img src="./assets/insidious.jpeg" alt="La noche del demonio">
                    <button class="movie-btn" data-movie="insidious">
                        Seleccionar
                    </button>
                </div>

                <div class="movie-card">
                    <h3>Spider-Man: Un nuevo día</h3>
                    <img src="./assets/spiderman.jpg" alt="spiderman">
                    <button class="movie-btn" data-movie="Spider-Man">
                        Seleccionar
                    </button>
                </div>

            </div>
        </section>

        <!-- Reservation Section -->
        <section id="reservation-section" class="hidden">

            <h2>Detalles de la Reserva</h2>

            <p>
                Película seleccionada:
                <strong id="selected-movie"></strong>
            </p>

            <label for="schedule">
                Elegí un horario:
            </label>

            <select id="schedule">
                <option value="18:00">18:00</option>
                <option value="20:00">20:00</option>
                <option value="22:00">22:00</option>
            </select>

            <label for="tickets">
                Cantidad de entradas:
            </label>

            <input
                type="number"
                id="tickets"
                min="1"
                value="1"
            >

            <button id="confirm-btn">
                Confirmar Reserva
            </button>

        </section>

        <!-- Success Message -->
        <section id="success-section" class="hidden">

            <h2>¡Reserva realizada con éxito!</h2>

            <p id="summary"></p>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
